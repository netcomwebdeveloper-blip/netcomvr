<style>
  :root { --warm: #ffd180; --cream: #fffaf0; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:#0d2a1a; overflow:hidden;
    font-family:"Baloo 2","Segoe UI Rounded",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
  canvas { display:block; }
  #title-card {
    position:fixed; inset:0; z-index:20; display:grid; place-content:center;
    justify-items:center; gap:20px; padding:24px; text-align:center;
    color:var(--cream); cursor:pointer;
    background:radial-gradient(circle at 50% 30%, #2b6b4b 0%, #0e3822 55%, #071a10 100%);
    transition:opacity 900ms ease, visibility 900ms;
  }
  #title-card.is-gone { opacity:0; visibility:hidden; pointer-events:none; }
  .house-icon { font-size:4.5rem; animation:bounce 2.2s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-10px) scale(1.06)} }
  #title-card h1 { margin:0; font-size:clamp(28px,6vw,58px); font-weight:800; line-height:1.1;
    text-shadow:0 4px 24px rgba(0,0,0,.4); }
  #title-card h1 em { font-style:normal; color:var(--warm); }
  #title-card p { margin:0; font-size:clamp(14px,2.2vw,18px); font-weight:600; color:rgba(255,250,240,.72); }
  .tap { margin-top:4px; padding:13px 28px; border-radius:999px;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3);
    font-size:16px; font-weight:700; animation:pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:.85} 50%{transform:scale(1.04);opacity:1} }
  #back-btn { position:fixed; top:16px; left:16px; z-index:15; padding:10px 18px;
    border:0; border-radius:999px; background:rgba(20,60,35,.82); color:#a8d8b0;
    font:700 14px "Baloo 2",system-ui; cursor:pointer; backdrop-filter:blur(6px);
    transition:background .2s; }
  #back-btn:hover { background:rgba(30,90,50,.92); }
  #vr-slot { position:fixed; right:16px; bottom:16px; z-index:15; }
  #vr-slot button { position:static!important; transform:none!important;
    font-family:"Baloo 2",system-ui!important; font-size:15px!important;
    font-weight:700!important; letter-spacing:0!important;
    background:rgba(255,209,102,.94)!important; color:#3a2405!important;
    border:1px solid rgba(255,255,255,.5)!important; border-radius:999px!important;
    padding:12px 22px!important; width:auto!important; opacity:1!important;
    cursor:pointer; box-shadow:0 10px 28px rgba(0,0,0,.28); }
  @media (prefers-reduced-motion:reduce) { *{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>

</div>
